<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowLime" cx="20%" cy="35%" r="60%">
      <stop offset="0" stop-color="#CCFF00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#CCFF00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#CCFF00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#CCFF00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CCFF00"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0B0F17"/>
  <rect width="1200" height="630" fill="url(#glowLime)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowBottom)"/>

  <!-- Bolt-V mark -->
  <g transform="translate(600 205)">
    <path d="M-85 -75 L0 75 L85 -75" stroke="url(#bolt)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" letter-spacing="10" fill="#CCFF00">VEES</text>

  <!-- Tagline -->
  <text x="600" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" letter-spacing="6" fill="#E5E7EB">ENERGY, EVOLVED</text>

  <!-- Sub-line -->
  <text x="600" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="2" fill="#9CA3AF">The ₹15 daily caffeine chew</text>
</svg>
