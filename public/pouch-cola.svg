<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="colaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
    <linearGradient id="colaChewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63"/>
      <stop offset="50%" style="stop-color:#6D4C41"/>
      <stop offset="100%" style="stop-color:#5D4037"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>
    <filter id="chewShadow2">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Main pouch body -->
  <rect x="40" y="30" width="320" height="460" rx="12" fill="url(#colaGrad)" filter="url(#shadow2)"/>

  <!-- Black top strip -->
  <rect x="40" y="30" width="320" height="40" rx="12" fill="#1a1a1a"/>
  <rect x="40" y="50" width="320" height="20" fill="#1a1a1a"/>

  <!-- Black bottom strip -->
  <rect x="40" y="450" width="320" height="40" rx="12" fill="#1a1a1a"/>
  <rect x="40" y="450" width="320" height="20" fill="#1a1a1a"/>

  <!-- 60mg badge -->
  <circle cx="310" cy="80" r="32" fill="#1a1a1a"/>
  <text x="310" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="white">60mg</text>

  <!-- VEES text -->
  <text x="200" y="210" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="90" fill="#6B3A1F" letter-spacing="2">VEES</text>

  <!-- CAFFEINE CHEWS -->
  <text x="200" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#333" letter-spacing="6">CAFFEINE CHEWS</text>

  <!-- Left side text -->
  <text x="68" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#6B3A1F" letter-spacing="3" transform="rotate(-90 68 280)">COLA</text>

  <!-- Right side text -->
  <text x="332" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#6B3A1F" letter-spacing="3" transform="rotate(90 332 280)">COLA</text>

  <!-- Chew pieces -->
  <g filter="url(#chewShadow2)">
    <rect x="165" y="300" width="50" height="40" rx="8" fill="url(#colaChewGrad)" transform="rotate(-5 190 320)"/>
    <rect x="130" y="315" width="50" height="40" rx="8" fill="url(#colaChewGrad)" transform="rotate(8 155 335)" opacity="0.9"/>
    <rect x="205" y="310" width="50" height="40" rx="8" fill="url(#colaChewGrad)" transform="rotate(-12 230 330)" opacity="0.85"/>
    <rect x="170" y="285" width="45" height="35" rx="7" fill="url(#colaChewGrad)" transform="rotate(3 192 302)" opacity="0.95"/>
  </g>

  <!-- Bottom text -->
  <text x="200" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="#555" letter-spacing="2">10 CHEWS · VEGETARIAN</text>
</svg>
